# Hardened composition for a delegated DeepSeek Harness subagent.
#
# The bundled runtime executable carries ~100 plugins; upstream's default config
# mounts eight of them and leaves the child with no compaction, no sandbox, no
# token accounting and no real file tools. This file mounts what a delegated
# coding agent actually needs.
#
# HARD RULE: stdout carries JSON-RPC frames. Never add a plugin that logs to
# stdout (packages/sdk/server/src/index.ts:4). stderr, a file, or the network only.

# --- transport -------------------------------------------------------------
# maxTokensAsSuccess stays false (the package default) so a run that exhausts
# its output cap is never reported as a success.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

# --- model -----------------------------------------------------------------
# defaultContextWindow is a WORKING BUDGET, not the model's capability. Both V4
# models really carry 1,000,000 tokens, but compaction's threshold is a ratio of
# whatever capacity the adapter reports: at 1M and thresholdRatio 0.8 the first
# compaction would fire at ~800k tokens, and an 800k-token prefix resent every
# turn costs real money. Sizing the budget from measured need rather than the
# vendor's maximum is the point.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: !!js process.env.DSA_REASONING_EFFORT ?? 'low'
    defaultContextWindow: !!js Number(process.env.DSA_CONTEXT_WINDOW ?? 200000)

# --- agent spine -----------------------------------------------------------
- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

# --- persistence -----------------------------------------------------------
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# --- sandbox ---------------------------------------------------------------
# Confines the model-facing FILE TOOLS (write, edit) to the workspace root.
#
# It does NOT confine bash. `@deepseek-ai/dsh-bash-sandbox` exists upstream but
# is NOT compiled into the bundled runtime executable -- only `dsh-bash-local`
# is -- so a bash call can still write outside the workspace. This is a partial
# guard, not a boundary. It also restricts file effects only: no network,
# process, or syscall restriction.
#
# Do not also mount '@deepseek-ai/dsh-sandbox'; sandbox-local registers the
# service itself and mounting both fails with "service sandbox has been
# registered".
- id: sandbox-local
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSA_SANDBOX_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

# Escalation beyond the sandbox needs an approval answerer. None is composed,
# and the seam fails closed, so escalation is denied deterministically. The SDK
# wire carries no approval message type, so this cannot prompt anyone -- it is a
# deny mechanism, not an approval channel.
- id: user-approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

# --- shell -----------------------------------------------------------------
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# Unsandboxed by necessity (see above). timeoutMs is the executor-level bound and
# is the only thing that actually bounds a bash call; the shipped tools declare
# no per-tool timeoutMs.
- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: !!js Number(process.env.DSA_BASH_TIMEOUT_MS ?? 60000)

# --- filesystem ------------------------------------------------------------
- id: fs
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# --- context engineering ---------------------------------------------------
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# Deterministic head/tail pruning of oversized tool results, no model call.
# Runs before summarization. Tool output is the dominant context consumer.
- id: compaction-tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
    maxOverflowRetries: 1

# --- guards ----------------------------------------------------------------
- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'

# --- supervised execution --------------------------------------------------
# PreToolUse fires on tools/pre-execute for EVERY tool, bash included, so this
# covers the gap the filesystem sandbox cannot. The hook is a local process; it
# asks this package's MCP server over a unix socket and exit 2 blocks the call
# with stderr as the reason the model sees.
- id: hooks-claude-code
  name: '@deepseek-ai/dsh-hooks-claude-code'
  config:
    configPath: !!js process.env.DSA_HOOKS_CONFIG ?? ''
    projectDir: !!js process.env.DSH_CWD ?? process.cwd()
    defaultTimeoutMs: 150000

# --- progress tracking -----------------------------------------------------
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false
